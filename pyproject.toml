[tool.pytest.ini_options]
testpaths = ["problems"]
# pythonpath puts the repo root on sys.path so tests can `from harness import load_solutions`.
# importlib import mode drops pytest's requirement that every test file have a globally unique
# basename -- without it, a second problem adding its own tests/test_solution.py would collide.
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
