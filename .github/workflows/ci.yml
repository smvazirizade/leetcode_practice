name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-uv installs Python as well, so no separate setup-python step is needed.
      # activate-environment creates and activates a venv, which is why the install below
      # needs no --system flag.
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # `uv sync` would fail here: it wants a [project] table, and this repo is deliberately
      # not an installable package. `uv pip install --group` reads the group directly.
      - name: Install dev dependencies
        run: uv pip install --group dev

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # -v lists every solution that was exercised, so the log itself shows that a newly
      # added solution was picked up by the filesystem-driven parametrization.
      - name: Tests
        run: pytest -v
